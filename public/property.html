<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property | Anjanay Heights</title><meta name="description" content="Verified property details from Anjanay Heights. Check live availability, photos, video and enquire on WhatsApp."><meta property="og:title" content="Property | Anjanay Heights"><meta property="og:description" content="Live property details, media and enquiry options."><meta name="theme-color" content="#1A365D"><style>body{margin:0;background:#f7f8fa;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;color:#1A365D}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px #0000000b}.hero{display:grid;grid-template-columns:1.15fr .85fr}.media{min-height:420px;background:#eef1f5;display:flex;align-items:center;justify-content:center}.media img,.media video{width:100%;height:100%;min-height:420px;object-fit:cover}.info{padding:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#b08d57;font-weight:800}.title{font-size:32px;line-height:1.1;margin:8px 0 10px;color:#1A365D}.meta{color:#667085;margin-bottom:20px}.price{font-size:24px;font-weight:800;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#f8fafc;border-radius:12px;padding:12px}.stat small{display:block;color:#98a2b3;font-size:11px}.stat b{display:block;margin-top:4px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;border-radius:12px;padding:12px 16px;font-weight:750;cursor:pointer}.primary{background:#1A365D;color:#fff}.secondary{border:1px solid #d0d5dd;color:#1A365D;background:#fff}.desc{margin-top:24px;line-height:1.65;color:#475467}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.gallery img{width:100%;height:170px;object-fit:cover;border-radius:12px}.note{padding:40px;text-align:center;color:#667085}.share-note{font-size:12px;color:#667085;margin-top:10px}@media(max-width:760px){.hero{grid-template-columns:1fr}.media,.media img,.media video{min-height:280px}.title{font-size:26px}.grid,.gallery{grid-template-columns:1fr 1fr}.info{padding:20px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">ANJANAY HEIGHTS</div><a class="btn secondary" href="/">Back to website</a></div><div id="app" class="card"><div class="note">Loading live property…</div></div></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>{const s=String(v??'').trim();return s||'Price on request'};const params=new URLSearchParams(location.search);const incomingSource=params.get('utm_source')||params.get('source')||'direct-property';const wa=(t)=>'https://wa.me/919289771222?text='+encodeURIComponent(t);const share=async(p)=>{const url=location.origin+location.pathname+'?id='+encodeURIComponent(p.id)+'&utm_source=property-share&utm_medium=whatsapp&utm_campaign=property-share';try{if(navigator.share){await navigator.share({title:p.title,text:'Check this property from Anjanay Heights',url});}else{await navigator.clipboard.writeText(url);alert('Property link copied. Share it on WhatsApp.')}}catch(e){if(e&&e.name!=='AbortError')alert('Share link: '+url)}};async function load(){const app=document.getElementById('app');const id=params.get('id');if(!id){app.innerHTML='<div class="note">Property link is incomplete. Please return to the website and choose a property.</div>';return}try{const r=await fetch('/api/inventory-public?property='+encodeURIComponent(id)+'&t='+Date.now(),{cache:'no-store'});const d=await r.json();let p=(d.properties||[]).find(x=>String(x.id)===String(id));if(!p){const all=await fetch('/api/inventory-public?t='+Date.now(),{cache:'no-store'}).then(x=>x.json());p=(all.properties||[]).find(x=>String(x.id)===String(id))}if(!p)throw new Error('Property not found or no longer available');const photos=Array.isArray(p.photos)?p.photos.filter(Boolean):[];const main=photos[0]||'';const msg='Hi Anjanay Heights, I am interested in '+p.title+' ('+p.location+'). I found this property via '+incomingSource+'. Please share current details and arrange a site visit.';const media=p.videoUrl?'<video controls playsinline preload="metadata" src="'+esc(p.videoUrl)+'"></video>':main?'<img src="'+esc(main)+'" alt="'+esc(p.title)+'">':'<div class="note">Photos coming soon</div>';document.title=esc(p.title)+' | Anjanay Heights';app.innerHTML='<div class="hero"><div class="media">'+media+'</div><div class="info"><div class="eyebrow">Live inventory · Available</div><h1 class="title">'+esc(p.title)+'</h1><div class="meta">'+esc(p.location)+' · '+esc(p.propertyType)+'</div><div class="price">'+esc(money(p.price))+'</div><div class="grid"><div class="stat"><small>BHK / CONFIG</small><b>'+esc(p.bedrooms||'—')+'</b></div><div class="stat"><small>AREA</small><b>'+esc(p.area||'—')+'</b></div><div class="stat"><small>STATUS</small><b>'+esc(p.status)+'</b></div></div><div class="actions"><a class="btn primary" href="'+wa(msg)+'" target="_blank" rel="noopener">WhatsApp Enquiry</a><a class="btn secondary" href="tel:+919289771222">Call Consultant</a><button class="btn secondary" onclick="share('+JSON.stringify(p).replace(/</g,'\\u003c')+')">↗ Share Property</button></div><div class="share-note">Share links carry property-share tracking so enquiries can be traced back to this property page.</div><div class="desc">'+esc(p.description||'Verified property details available through Anjanay Heights.')+'</div></div></div>'+(photos.length>1?'<div class="info"><div class="eyebrow">Property photos</div><div class="gallery">'+photos.slice(0,6).map(x=>'<img loading="lazy" src="'+esc(x)+'" alt="'+esc(p.title)+' photo">').join('')+'</div></div>':'')}catch(e){app.innerHTML='<div class="note">'+esc(e.message||'Unable to load this property.')+'<br><br><a class="btn primary" href="/">Browse live inventory</a></div>'}}load();</script></body></html>
